<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Views Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: [
                            "Inter",
                            "ui-sans-serif",
                            "system-ui",
                            "sans-serif"
                        ]
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">

    <!-- Header -->
    <header class="mb-6">

        <div class="flex items-center justify-between gap-4">

            <div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
                    Views Tracker
                </h1>

                <p class="text-sm text-zinc-500 mt-1">
                    URL views analytics
                </p>
            </div>

            <button
                id="refreshBtn"
                onclick="loadData()"
                class="
                    inline-flex items-center gap-2
                    px-3 py-2
                    rounded-lg
                    bg-zinc-900
                    border border-zinc-800
                    hover:bg-zinc-800
                    transition
                    text-sm
                "
            >
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span class="hidden sm:inline">
                    Refresh
                </span>
            </button>

        </div>

    </header>


    <!-- Filters -->
    <section
        class="
            bg-zinc-900/70
            border border-zinc-800
            rounded-xl
            p-4
            mb-5
        "
    >

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">

            <!-- Date -->
            <div class="relative">

                <i
                    data-lucide="calendar-days"
                    class="
                        absolute
                        left-3
                        top-1/2
                        -translate-y-1/2
                        w-4
                        h-4
                        text-zinc-500
                        pointer-events-none
                    "
                ></i>

                <input
                    type="date"
                    id="date"
                    class="
                        w-full
                        h-11
                        pl-10
                        pr-3
                        rounded-lg
                        bg-zinc-950
                        border border-zinc-800
                        text-sm
                        text-zinc-200
                        outline-none
                        focus:border-zinc-600
                    "
                >

            </div>


            <!-- URL Search -->
            <div class="relative md:col-span-2">

                <i
                    data-lucide="search"
                    class="
                        absolute
                        left-3
                        top-1/2
                        -translate-y-1/2
                        w-4
                        h-4
                        text-zinc-500
                        pointer-events-none
                    "
                ></i>

                <input
                    type="text"
                    id="urlSearch"
                    placeholder="Search URL..."
                    class="
                        w-full
                        h-11
                        pl-10
                        pr-3
                        rounded-lg
                        bg-zinc-950
                        border border-zinc-800
                        text-sm
                        text-zinc-200
                        placeholder:text-zinc-600
                        outline-none
                        focus:border-zinc-600
                    "
                >

            </div>

        </div>

    </section>


    <!-- Stats -->
    <section
        class="
            grid
            grid-cols-2
            lg:grid-cols-3
            gap-3
            mb-5
        "
    >

        <!-- Views -->
        <div
            class="
                bg-zinc-900/70
                border border-zinc-800
                rounded-xl
                p-4
            "
        >

            <div class="flex items-center gap-2 mb-3">

                <div
                    class="
                        w-8 h-8
                        rounded-lg
                        bg-zinc-800
                        flex
                        items-center
                        justify-center
                    "
                >
                    <i
                        data-lucide="eye"
                        class="w-4 h-4 text-zinc-300"
                    ></i>
                </div>

                <span class="text-xs text-zinc-500">
                    Total Views
                </span>

            </div>

            <div
                id="totalViews"
                class="text-2xl font-bold"
            >
                0
            </div>

        </div>


        <!-- URLs -->
        <div
            class="
                bg-zinc-900/70
                border border-zinc-800
                rounded-xl
                p-4
            "
        >

            <div class="flex items-center gap-2 mb-3">

                <div
                    class="
                        w-8 h-8
                        rounded-lg
                        bg-zinc-800
                        flex
                        items-center
                        justify-center
                    "
                >
                    <i
                        data-lucide="link"
                        class="w-4 h-4 text-zinc-300"
                    ></i>
                </div>

                <span class="text-xs text-zinc-500">
                    URLs
                </span>

            </div>

            <div
                id="totalUrls"
                class="text-2xl font-bold"
            >
                0
            </div>

        </div>


        <!-- Records -->
        <div
            class="
                col-span-2
                lg:col-span-1
                bg-zinc-900/70
                border border-zinc-800
                rounded-xl
                p-4
            "
        >

            <div class="flex items-center gap-2 mb-3">

                <div
                    class="
                        w-8 h-8
                        rounded-lg
                        bg-zinc-800
                        flex
                        items-center
                        justify-center
                    "
                >
                    <i
                        data-lucide="database"
                        class="w-4 h-4 text-zinc-300"
                    ></i>
                </div>

                <span class="text-xs text-zinc-500">
                    Records
                </span>

            </div>

            <div
                id="totalRecords"
                class="text-2xl font-bold"
            >
                0
            </div>

        </div>

    </section>


    <!-- Table -->
    <section
        class="
            bg-zinc-900/70
            border border-zinc-800
            rounded-xl
            overflow-hidden
        "
    >

        <!-- Table header -->
        <div
            class="
                px-4 py-3
                border-b border-zinc-800
                flex
                items-center
                justify-between
            "
        >

            <div class="flex items-center gap-2">

                <i
                    data-lucide="bar-chart-3"
                    class="w-4 h-4 text-zinc-400"
                ></i>

                <span class="text-sm font-medium">
                    View Statistics
                </span>

            </div>

            <span
                id="selectedDate"
                class="text-xs text-zinc-500"
            >
                All dates
            </span>

        </div>


        <!-- Status -->
        <div
            id="status"
            class="py-12 text-center text-sm text-zinc-500"
        >
            Loading...
        </div>


        <!-- Table -->
        <div
            id="tableWrapper"
            class="overflow-x-auto hidden"
        >

            <table class="w-full text-sm">

                <thead>

                    <tr
                        class="
                            border-b
                            border-zinc-800
                            text-zinc-500
                            text-xs
                        "
                    >

                        <th class="text-left px-4 py-3 font-medium">
                            #
                        </th>

                        <th class="text-left px-4 py-3 font-medium">
                            Date
                        </th>

                        <th class="text-left px-4 py-3 font-medium">
                            URL
                        </th>

                        <th class="text-right px-4 py-3 font-medium">
                            Views
                        </th>

                        <th class="text-left px-4 py-3 font-medium whitespace-nowrap">
                            Last Modified
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="tableBody"
                    class="divide-y divide-zinc-800/70"
                ></tbody>

            </table>

        </div>

    </section>

</div>


<script>

/*
|--------------------------------------------------------------------------
| API
|--------------------------------------------------------------------------
*/

const API_URL =
    "https://track.mohit-raiya.workers.dev";


/*
|--------------------------------------------------------------------------
| Get password from permalink
|--------------------------------------------------------------------------
|
| https://prakashraiya.pages.dev/track?pass=pkview
|
*/

const params =
    new URLSearchParams(window.location.search);

const PASSWORD =
    params.get("pass");


/*
|--------------------------------------------------------------------------
| Data cache
|--------------------------------------------------------------------------
*/

let allData = [];


/*
|--------------------------------------------------------------------------
| DOM
|--------------------------------------------------------------------------
*/

const dateInput =
    document.getElementById("date");

const searchInput =
    document.getElementById("urlSearch");

const statusBox =
    document.getElementById("status");

const tableWrapper =
    document.getElementById("tableWrapper");

const tableBody =
    document.getElementById("tableBody");

const refreshBtn =
    document.getElementById("refreshBtn");

    
function getTodayLocal() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return (year + "-" + month + "-" + day);
}
dateInput.value = getTodayLocal();

/*
|--------------------------------------------------------------------------
| Load API data
|--------------------------------------------------------------------------
*/

async function loadData() {

    if (!PASSWORD) {

        showError(
            "Password is missing from the URL."
        );

        return;
    }


    setLoading(true);


    try {

        /*
         * We fetch all data once.
         *
         * Date and URL filtering is done locally.
         */

        const apiUrl =
            API_URL +
            "/views?password=" +
            encodeURIComponent(PASSWORD);


        const response =
            await fetch(apiUrl, {
                method: "GET",
                cache: "no-store"
            });


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.error ||
                "Unable to load data."
            );

        }


        allData =
            Array.isArray(result.data)
                ? result.data
                : [];


        renderData();


    } catch (error) {

        console.error(error);

        showError(
            error.message ||
            "Unable to connect to API."
        );

    } finally {

        setLoading(false);

    }

}


/*
|--------------------------------------------------------------------------
| Render / filter data
|--------------------------------------------------------------------------
*/

function renderData() {

    const selectedDate =
        dateInput.value;

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    let data =
        [...allData];


    /*
     * Date filter
     */

    if (selectedDate) {

        data =
            data.filter(item =>
                String(item.view_date || "") ===
                selectedDate
            );

    }


    /*
     * URL filter
     */

    if (search) {

        data =
            data.filter(item =>
                String(item.url || "")
                    .toLowerCase()
                    .includes(search)
            );

    }


    /*
     * Sort
     */

    data.sort((a, b) => {

        const viewsA =
            Number(a.views || 0);

        const viewsB =
            Number(b.views || 0);

        return viewsB - viewsA;

    });


    /*
     * Stats
     */

    let totalViews = 0;

    const urls =
        new Set();


    data.forEach(item => {

        totalViews +=
            Number(item.views || 0);

        urls.add(item.url);

    });


    document.getElementById("totalViews")
        .textContent =
        totalViews.toLocaleString("en-IN");


    document.getElementById("totalUrls")
        .textContent =
        urls.size.toLocaleString("en-IN");


    document.getElementById("totalRecords")
        .textContent =
        data.length.toLocaleString("en-IN");


    /*
     * Selected date label
     */

    document.getElementById("selectedDate")
        .textContent =
        selectedDate
            ? formatDateOnly(selectedDate)
            : "All dates";


    /*
     * Empty
     */

    if (!data.length) {

        tableWrapper.classList.add("hidden");

        statusBox.className =
            "py-12 text-center text-sm text-zinc-500";

        statusBox.textContent =
            "No data found.";

        statusBox.classList.remove("hidden");

        return;
    }


    /*
     * Table
     */

    tableBody.innerHTML =
        data.map((item, index) => {

            return `

                <tr class="
                    hover:bg-zinc-800/30
                    transition
                ">

                    <td class="
                        px-4 py-3
                        text-zinc-600
                        whitespace-nowrap
                    ">
                        ${index + 1}
                    </td>


                    <td class="
                        px-4 py-3
                        text-zinc-400
                        whitespace-nowrap
                    ">
                        ${escapeHtml(
                            item.view_date || "-"
                        )}
                    </td>


                    <td class="
                        px-4 py-3
                        max-w-[450px]
                    ">

                        <a
                            href="${escapeAttribute(item.url || "#")}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="
                                text-zinc-300
                                hover:text-white
                                hover:underline
                                break-all
                            "
                        >
                            ${escapeHtml(
                                item.url || "-"
                            )}
                        </a>

                    </td>


                    <td class="
                        px-4 py-3
                        text-right
                        font-semibold
                        text-white
                        whitespace-nowrap
                    ">
                        ${Number(
                            item.views || 0
                        ).toLocaleString("en-IN")}
                    </td>


                    <td class="
                        px-4 py-3
                        text-zinc-500
                        whitespace-nowrap
                    ">
                        ${formatTimestamp(
                            item.last_modified
                        )}
                    </td>

                </tr>

            `;

        }).join("");


    statusBox.classList.add("hidden");

    tableWrapper.classList.remove("hidden");

}


/*
|--------------------------------------------------------------------------
| Loading state
|--------------------------------------------------------------------------
*/

function setLoading(loading) {

    if (loading) {

        refreshBtn.disabled = true;

        refreshBtn.classList.add(
            "opacity-50",
            "cursor-not-allowed"
        );

        statusBox.className =
            "py-12 text-center text-sm text-zinc-500";

        statusBox.innerHTML = `
            <div class="flex items-center justify-center gap-2">
                <i
                    data-lucide="loader-circle"
                    class="w-4 h-4 animate-spin"
                ></i>
                Loading...
            </div>
        `;

        statusBox.classList.remove("hidden");

        tableWrapper.classList.add("hidden");

        lucide.createIcons();

    } else {

        refreshBtn.disabled = false;

        refreshBtn.classList.remove(
            "opacity-50",
            "cursor-not-allowed"
        );

    }

}


/*
|--------------------------------------------------------------------------
| Error
|--------------------------------------------------------------------------
*/

function showError(message) {

    statusBox.className =
        "py-12 px-4 text-center text-sm text-red-400";

    statusBox.innerHTML = `

        <div class="flex flex-col items-center gap-3">

            <div
                class="
                    w-10 h-10
                    rounded-full
                    bg-red-500/10
                    flex
                    items-center
                    justify-center
                "
            >
                <i
                    data-lucide="circle-alert"
                    class="w-5 h-5"
                ></i>
            </div>

            <div>
                ${escapeHtml(message)}
            </div>

        </div>

    `;

    statusBox.classList.remove("hidden");

    tableWrapper.classList.add("hidden");

    lucide.createIcons();

}


/*
|--------------------------------------------------------------------------
| Date formatting
|--------------------------------------------------------------------------
*/

function formatDateOnly(date) {

    if (!date) {
        return "-";
    }

    const parts =
        date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return `${parts[2]}-${parts[1]}-${parts[0]}`;

}


/*
|--------------------------------------------------------------------------
| Timestamp formatting
|--------------------------------------------------------------------------
*/

function formatTimestamp(timestamp) {

    if (!timestamp) {
        return "-";
    }

    const date =
        new Date(Number(timestamp));

    if (isNaN(date.getTime())) {
        return "-";
    }

    return date.toLocaleString(
        "en-IN",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}


/*
|--------------------------------------------------------------------------
| HTML escape
|--------------------------------------------------------------------------
*/

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
|--------------------------------------------------------------------------
| Attribute escape
|--------------------------------------------------------------------------
*/

function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


/*
|--------------------------------------------------------------------------
| Filters
|--------------------------------------------------------------------------
*/

dateInput.addEventListener(
    "change",
    renderData
);

searchInput.addEventListener(
    "input",
    renderData
);


/*
|--------------------------------------------------------------------------
| Initial load
|--------------------------------------------------------------------------
*/

lucide.createIcons();

loadData();

</script>

</body>
</html>
