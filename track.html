<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URL Views Analytics</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: [
                            "Inter",
                            "ui-sans-serif",
                            "system-ui",
                            "sans-serif"
                        ]
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-[#09090b] text-zinc-100 font-sans">

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-5 mb-8">

        <div>
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center">
                    <i data-lucide="bar-chart-3"
                       class="w-5 h-5 text-indigo-400"></i>
                </div>

                <div>
                    <h1 class="text-2xl font-bold tracking-tight">
                        URL Analytics
                    </h1>

                    <p class="text-sm text-zinc-500 mt-1">
                        Website views dashboard
                    </p>
                </div>
            </div>
        </div>


        <button
            id="refreshBtn"
            onclick="loadViews()"
            class="inline-flex items-center justify-center gap-2
                   px-4 py-2.5 rounded-xl
                   bg-zinc-800 hover:bg-zinc-700
                   border border-zinc-700
                   text-sm font-medium
                   transition">

            <i data-lucide="refresh-cw"
               id="refreshIcon"
               class="w-4 h-4"></i>

            Refresh
        </button>

    </div>


    <!-- Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">

        <!-- URLs -->
        <div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-5">

            <div class="flex items-center justify-between">

                <div>
                    <p class="text-sm text-zinc-500">
                        Total URLs
                    </p>

                    <p
                        id="totalUrls"
                        class="text-3xl font-bold mt-2">
                        0
                    </p>
                </div>

                <div class="w-11 h-11 rounded-xl bg-blue-500/10
                            flex items-center justify-center">

                    <i data-lucide="link-2"
                       class="w-5 h-5 text-blue-400"></i>

                </div>

            </div>

        </div>


        <!-- Views -->
        <div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-5">

            <div class="flex items-center justify-between">

                <div>
                    <p class="text-sm text-zinc-500">
                        Total Views
                    </p>

                    <p
                        id="totalViews"
                        class="text-3xl font-bold mt-2">
                        0
                    </p>
                </div>

                <div class="w-11 h-11 rounded-xl bg-emerald-500/10
                            flex items-center justify-center">

                    <i data-lucide="eye"
                       class="w-5 h-5 text-emerald-400"></i>

                </div>

            </div>

        </div>

    </div>


    <!-- Error -->
    <div
        id="error"
        class="hidden mb-5 rounded-xl border border-red-500/20
               bg-red-500/10 px-4 py-3 text-sm text-red-400">
    </div>


    <!-- Table -->
    <div class="rounded-2xl border border-zinc-800
                bg-zinc-900/70 overflow-hidden">

        <!-- Table header -->
        <div class="px-5 py-4 border-b border-zinc-800
                    flex items-center justify-between">

            <div>
                <h2 class="font-semibold">
                    URL Views
                </h2>

                <p class="text-xs text-zinc-500 mt-1">
                    Latest modified URLs appear first
                </p>
            </div>

            <div class="flex items-center gap-2 text-xs text-zinc-500">

                <span
                    id="statusDot"
                    class="w-2 h-2 rounded-full bg-emerald-500">
                </span>

                Live
            </div>

        </div>


        <!-- Responsive table -->
        <div class="overflow-x-auto">

            <table class="w-full min-w-[700px]">

                <thead>
                    <tr class="border-b border-zinc-800 text-left">

                        <th class="px-5 py-3 text-xs font-medium
                                   text-zinc-500 uppercase tracking-wider">
                            #
                        </th>

                        <th class="px-5 py-3 text-xs font-medium
                                   text-zinc-500 uppercase tracking-wider">
                            URL
                        </th>

                        <th class="px-5 py-3 text-xs font-medium
                                   text-zinc-500 uppercase tracking-wider">
                            Views
                        </th>

                        <th class="px-5 py-3 text-xs font-medium
                                   text-zinc-500 uppercase tracking-wider">
                            Last Modified
                        </th>

                    </tr>
                </thead>

                <tbody
                    id="tableBody"
                    class="divide-y divide-zinc-800">
                </tbody>

            </table>

        </div>

    </div>


    <!-- Footer -->
    <div class="mt-5 flex items-center justify-between text-xs text-zinc-600">

        <span>
            URL View Tracker
        </span>

        <span id="lastUpdated">
            -
        </span>

    </div>

</div>


<script>

/* ============================================
   CONFIG
============================================ */
 const params = new URLSearchParams(window.location.search);

const API_URL =
    "https://track.mohit-raiya.workers.dev/views";

const PASSWORD = params.get('pass') || "1234";

/* ============================================
   LOAD DATA
============================================ */

async function loadViews() {

    const refreshBtn =
        document.getElementById("refreshBtn");

    const refreshIcon =
        document.getElementById("refreshIcon");

    const tableBody =
        document.getElementById("tableBody");

    const errorBox =
        document.getElementById("error");

    const statusDot =
        document.getElementById("statusDot");


    refreshBtn.disabled = true;

    refreshIcon.classList.add("animate-spin");

    errorBox.classList.add("hidden");

    statusDot.className =
        "w-2 h-2 rounded-full bg-yellow-400";


    try {

        const response = await fetch(
            API_URL +
            "?password=" +
            encodeURIComponent(PASSWORD),
            {
                method: "GET",
                cache: "no-store"
            }
        );


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.error ||
                "Unable to load analytics"
            );

        }


        let data =
            Array.isArray(result.data)
                ? result.data
                : [];


        /* Latest modified first */
        data.sort(function(a, b) {

            return Number(b.last_modified || 0) -
                   Number(a.last_modified || 0);

        });


        /* ============================================
           STATS
        ============================================ */

        document.getElementById("totalUrls")
            .textContent =
            data.length.toLocaleString();


        const totalViews =
            data.reduce(function(total, item) {

                return total +
                    Number(item.views || 0);

            }, 0);


        document.getElementById("totalViews")
            .textContent =
            totalViews.toLocaleString();


        /* ============================================
           TABLE
        ============================================ */

        tableBody.innerHTML = "";


        if (!data.length) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="4"
                        class="px-5 py-12 text-center">

                        <div class="flex flex-col
                                    items-center
                                    text-zinc-500">

                            <i data-lucide="database"
                               class="w-8 h-8 mb-3">
                            </i>

                            <p class="text-sm">
                                No URL data found
                            </p>

                        </div>

                    </td>
                </tr>
            `;

            lucide.createIcons();

            return;
        }


        data.forEach(function(item, index) {

            const tr =
                document.createElement("tr");


            tr.className =
                "hover:bg-zinc-800/40 transition";


            const date =
                item.last_modified
                    ? new Date(
                        Number(item.last_modified)
                    ).toLocaleString()
                    : "-";


            tr.innerHTML = `

                <td class="px-5 py-4 text-sm text-zinc-500">
                    ${index + 1}
                </td>


                <td class="px-5 py-4">

                    <div class="flex items-start gap-3">

                        <div class="mt-0.5 w-8 h-8 shrink-0
                                    rounded-lg
                                    bg-indigo-500/10
                                    flex items-center justify-center">

                            <i data-lucide="globe"
                               class="w-4 h-4 text-indigo-400">
                            </i>

                        </div>

                        <a
                            href="${escapeHtml(item.url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="text-sm text-zinc-300
                                   hover:text-indigo-400
                                   transition break-all">

                            ${escapeHtml(item.url)}

                        </a>

                    </div>

                </td>


                <td class="px-5 py-4">

                    <div class="inline-flex items-center gap-2
                                px-2.5 py-1 rounded-lg
                                bg-emerald-500/10
                                text-emerald-400
                                text-sm font-semibold">

                        <i data-lucide="eye"
                           class="w-3.5 h-3.5">
                        </i>

                        ${Number(
                            item.views || 0
                        ).toLocaleString()}

                    </div>

                </td>


                <td class="px-5 py-4 text-sm text-zinc-500">

                    <div class="flex items-center gap-2">

                        <i data-lucide="clock-3"
                           class="w-4 h-4">
                        </i>

                        ${escapeHtml(date)}

                    </div>

                </td>

            `;


            tableBody.appendChild(tr);

        });


        /* Icons */
        lucide.createIcons();


        /* Status */
        statusDot.className =
            "w-2 h-2 rounded-full bg-emerald-500";


        document.getElementById("lastUpdated")
            .textContent =
            "Updated " +
            new Date().toLocaleTimeString();


    } catch (error) {

        console.error(error);


        errorBox.textContent =
            error.message ||
            "Failed to load data";


        errorBox.classList.remove("hidden");


        statusDot.className =
            "w-2 h-2 rounded-full bg-red-500";


        tableBody.innerHTML = `
            <tr>
                <td colspan="4"
                    class="px-5 py-12 text-center
                           text-sm text-zinc-500">

                    Failed to load data

                </td>
            </tr>
        `;

    } finally {

        refreshBtn.disabled = false;

        refreshIcon.classList.remove("animate-spin");

    }

}


/* ============================================
   HTML ESCAPE
============================================ */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================
   INITIAL LOAD
============================================ */

lucide.createIcons();

loadViews();

</script>

</body>
</html>
