<script>


/*
|--------------------------------------------------------------------------
| API
|--------------------------------------------------------------------------
*/

const API_URL =
    "https://track.mohit-raiya.workers.dev";



/*
|--------------------------------------------------------------------------
| PASSWORD FROM URL
|--------------------------------------------------------------------------
|
| Example:
|
| https://prakashraiya.pages.dev/track?pass=pkview
|
*/

const params =
    new URLSearchParams(
        window.location.search
    );


const PASSWORD =
    params.get("pass");



/*
|--------------------------------------------------------------------------
| DATA CACHE
|--------------------------------------------------------------------------
*/

let allData = [];



/*
|--------------------------------------------------------------------------
| DOM ELEMENTS
|--------------------------------------------------------------------------
*/

const dateInput =
    document.getElementById("date");


const searchInput =
    document.getElementById("urlSearch");


const statusBox =
    document.getElementById("status");


const tableWrapper =
    document.getElementById("tableWrapper");


const tableBody =
    document.getElementById("tableBody");


const refreshBtn =
    document.getElementById("refreshBtn");



/*
|--------------------------------------------------------------------------
| GET TODAY LOCAL DATE
|--------------------------------------------------------------------------
*/

function getTodayLocal() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}



/*
|--------------------------------------------------------------------------
| DEFAULT DATE = TODAY
|--------------------------------------------------------------------------
*/

dateInput.value =
    getTodayLocal();



/*
|--------------------------------------------------------------------------
| LOAD API DATA
|--------------------------------------------------------------------------
*/

async function loadData() {


    if (!PASSWORD) {

        showError(
            "Password is missing from the URL."
        );

        return;

    }


    setLoading(true);



    try {


        /*
        --------------------------------------------------------------
        | API URL
        --------------------------------------------------------------
        */

        const apiUrl =
            API_URL +
            "/views?password=" +
            encodeURIComponent(
                PASSWORD
            );



        /*
        --------------------------------------------------------------
        | FETCH
        --------------------------------------------------------------
        */

        const response =
            await fetch(
                apiUrl,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );



        /*
        --------------------------------------------------------------
        | JSON
        --------------------------------------------------------------
        */

        const result =
            await response.json();



        /*
        --------------------------------------------------------------
        | ERROR
        --------------------------------------------------------------
        */

        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to load data."
            );

        }



        /*
        --------------------------------------------------------------
        | SAVE DATA
        --------------------------------------------------------------
        */

        allData =
            Array.isArray(
                result.data
            )
                ? result.data
                : [];



        /*
        --------------------------------------------------------------
        | RENDER
        --------------------------------------------------------------
        */

        renderData();


    } catch (error) {


        console.error(error);


        showError(
            error.message ||
            "Unable to connect to API."
        );


    } finally {


        setLoading(false);

    }

}



/*
|--------------------------------------------------------------------------
| RENDER DATA
|--------------------------------------------------------------------------
*/

function renderData() {


    const selectedDate =
        dateInput.value;


    const search =
        searchInput.value
            .trim()
            .toLowerCase();



    /*
    --------------------------------------------------------------
    | COPY DATA
    --------------------------------------------------------------
    */

    let data =
        [...allData];



    /*
    --------------------------------------------------------------
    | DATE FILTER
    --------------------------------------------------------------
    */

    if (selectedDate) {

        data =
            data.filter(
                item =>
                    String(
                        item.view_date ||
                        ""
                    ) ===
                    selectedDate
            );

    }



    /*
    --------------------------------------------------------------
    | URL SEARCH FILTER
    --------------------------------------------------------------
    */

    if (search) {

        data =
            data.filter(
                item =>
                    String(
                        item.url ||
                        ""
                    )
                        .toLowerCase()
                        .includes(search)
            );

    }



    /*
    --------------------------------------------------------------
    | SORT BY VIEWS
    --------------------------------------------------------------
    */

    data.sort(
        (a, b) => {

            const viewsA =
                Number(
                    a.views || 0
                );


            const viewsB =
                Number(
                    b.views || 0
                );


            return (
                viewsB -
                viewsA
            );

        }
    );



    /*
    --------------------------------------------------------------
    | STATS
    --------------------------------------------------------------
    */

    let totalViews =
        0;


    const urls =
        new Set();



    data.forEach(
        item => {

            totalViews +=
                Number(
                    item.views || 0
                );


            urls.add(
                item.url
            );

        }
    );



    /*
    --------------------------------------------------------------
    | TOTAL VIEWS
    --------------------------------------------------------------
    */

    document
        .getElementById(
            "totalViews"
        )
        .textContent =
        totalViews.toLocaleString(
            "en-IN"
        );



    /*
    --------------------------------------------------------------
    | TOTAL URLS
    --------------------------------------------------------------
    */

    document
        .getElementById(
            "totalUrls"
        )
        .textContent =
        urls.size.toLocaleString(
            "en-IN"
        );



    /*
    --------------------------------------------------------------
    | TOTAL RECORDS
    --------------------------------------------------------------
    */

    document
        .getElementById(
            "totalRecords"
        )
        .textContent =
        data.length.toLocaleString(
            "en-IN"
        );



    /*
    --------------------------------------------------------------
    | SELECTED DATE
    --------------------------------------------------------------
    */

    document
        .getElementById(
            "selectedDate"
        )
        .textContent =
        selectedDate
            ? formatDateOnly(
                selectedDate
            )
            : "All dates";



    /*
    --------------------------------------------------------------
    | NO DATA
    --------------------------------------------------------------
    */

    if (!data.length) {


        tableWrapper.classList.add(
            "hidden"
        );


        statusBox.className =
            "py-12 px-4 text-center text-sm text-zinc-500";


        statusBox.textContent =
            "No data found.";


        statusBox.classList.remove(
            "hidden"
        );


        return;

    }



    /*
    --------------------------------------------------------------
    | TABLE HTML
    --------------------------------------------------------------
    */

    tableBody.innerHTML =
        data
            .map(
                (item, index) => {


                    const url =
                        String(
                            item.url ||
                            "-"
                        );



                    return `

                        <tr
                            class="
                                hover:bg-zinc-800/30
                                transition
                            "
                        >


                            <!-- NUMBER -->

                            <td
                                class="
                                    col-number
                                    px-4
                                    py-3
                                    text-zinc-600
                                    align-top
                                "
                            >
                                ${index + 1}
                            </td>



                            <!-- DATE -->

                            <td
                                class="
                                    col-date
                                    px-4
                                    py-3
                                    text-zinc-400
                                    align-top
                                "
                            >
                                ${escapeHtml(
                                    item.view_date ||
                                    "-"
                                )}
                            </td>



                            <!-- URL -->

                            <td
                                class="
                                    col-url
                                    url-cell
                                    px-4
                                    py-3
                                    align-top
                                "
                            >

                                <a
                                    href="${escapeAttribute(
                                        item.url ||
                                        "#"
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    title="${escapeAttribute(
                                        url
                                    )}"
                                    class="
                                        url-link
                                        text-zinc-300
                                        hover:text-white
                                        hover:underline
                                    "
                                >
                                    ${escapeHtml(
                                        url
                                    )}
                                </a>

                            </td>



                            <!-- VIEWS -->

                            <td
                                class="
                                    col-views
                                    px-4
                                    py-3
                                    text-right
                                    font-semibold
                                    text-white
                                    align-top
                                "
                            >
                                ${Number(
                                    item.views || 0
                                ).toLocaleString(
                                    "en-IN"
                                )}
                            </td>



                            <!-- LAST MODIFIED -->

                            <td
                                class="
                                    col-modified
                                    px-4
                                    py-3
                                    text-zinc-500
                                    align-top
                                "
                            >
                                ${formatTimestamp(
                                    item.last_modified
                                )}
                            </td>


                        </tr>

                    `;

                }
            )
            .join("");



    /*
    --------------------------------------------------------------
    | SHOW TABLE
    --------------------------------------------------------------
    */

    statusBox.classList.add(
        "hidden"
    );


    tableWrapper.classList.remove(
        "hidden"
    );

}



/*
|--------------------------------------------------------------------------
| LOADING STATE
|--------------------------------------------------------------------------
*/

function setLoading(
    loading
) {


    if (loading) {


        refreshBtn.disabled =
            true;


        refreshBtn.classList.add(
            "opacity-50",
            "cursor-not-allowed"
        );



        statusBox.className =
            "py-12 text-center text-sm text-zinc-500";



        statusBox.innerHTML = `

            <div
                class="
                    flex
                    items-center
                    justify-center
                    gap-2
                "
            >

                <i
                    data-lucide="loader-circle"
                    class="
                        w-4
                        h-4
                        animate-spin
                    "
                ></i>

                Loading...

            </div>

        `;



        statusBox.classList.remove(
            "hidden"
        );


        tableWrapper.classList.add(
            "hidden"
        );


        lucide.createIcons();


    } else {


        refreshBtn.disabled =
            false;


        refreshBtn.classList.remove(
            "opacity-50",
            "cursor-not-allowed"
        );

    }

}



/*
|--------------------------------------------------------------------------
| ERROR
|--------------------------------------------------------------------------
*/

function showError(
    message
) {


    statusBox.className =
        "py-12 px-4 text-center text-sm text-red-400";



    statusBox.innerHTML = `

        <div
            class="
                flex
                flex-col
                items-center
                gap-3
            "
        >

            <div
                class="
                    w-10
                    h-10
                    rounded-full
                    bg-red-500/10
                    flex
                    items-center
                    justify-center
                "
            >

                <i
                    data-lucide="circle-alert"
                    class="w-5 h-5"
                ></i>

            </div>


            <div>
                ${escapeHtml(
                    message
                )}
            </div>

        </div>

    `;



    statusBox.classList.remove(
        "hidden"
    );


    tableWrapper.classList.add(
        "hidden"
    );


    lucide.createIcons();

}



/*
|--------------------------------------------------------------------------
| DATE FORMAT
|--------------------------------------------------------------------------
*/

function formatDateOnly(
    date
) {


    if (!date) {

        return "-";

    }



    const parts =
        date.split("-");



    if (
        parts.length !== 3
    ) {

        return date;

    }



    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );

}



/*
|--------------------------------------------------------------------------
| TIMESTAMP FORMAT
|--------------------------------------------------------------------------
*/

function formatTimestamp(
    timestamp
) {


    if (!timestamp) {

        return "-";

    }



    const date =
        new Date(
            Number(timestamp)
        );



    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }



    return date.toLocaleString(
        "en-IN",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}



/*
|--------------------------------------------------------------------------
| HTML ESCAPE
|--------------------------------------------------------------------------
*/

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/*
|--------------------------------------------------------------------------
| ATTRIBUTE ESCAPE
|--------------------------------------------------------------------------
*/

function escapeAttribute(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}



/*
|--------------------------------------------------------------------------
| DATE FILTER
|--------------------------------------------------------------------------
*/

dateInput.addEventListener(
    "change",
    renderData
);



/*
|--------------------------------------------------------------------------

|--------------------------------------------------------------------------
*/

searchInput.addEventListener(
    "input",
    renderData
);

lucide.createIcons();


loadData();
